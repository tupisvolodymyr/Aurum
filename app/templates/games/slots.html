{% extends "base.html" %}
{% block title %}Golden Reels — AURUM{% endblock %}

{% block content %}
<a class="back-link" href="/">&larr; Back to Lobby</a>

<div class="slot-machine" id="slot-machine">
    <div class="slot-reels" id="slot-reels">
        <div class="reel-window"><div class="reel-strip"><div class="reel-symbol">❔</div></div></div>
        <div class="reel-window"><div class="reel-strip"><div class="reel-symbol">❔</div></div></div>
        <div class="reel-window"><div class="reel-strip"><div class="reel-symbol">❔</div></div></div>
    </div>

    <p class="slot-message" id="slot-message" aria-live="polite"></p>

    <form id="slot-form" class="slot-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <label for="bet">Ставка (₴)</label>
        <input type="number" id="bet" name="bet" min="{{ min_bet }}" max="{{ max_bet }}" step="1" value="{{ min_bet }}" required>

        <button type="submit" class="btn btn-primary" id="spin-button">Крутити</button>
    </form>

    <details class="paytable">
        <summary>Таблиця виплат</summary>
        <table>
            <tr><td>7️⃣ 7️⃣ 7️⃣</td><td>x500</td></tr>
            <tr><td>💎 💎 💎</td><td>x150</td></tr>
            <tr><td>⭐ ⭐ ⭐</td><td>x50</td></tr>
            <tr><td>🔔 🔔 🔔</td><td>x25</td></tr>
            <tr><td>🍊 🍊 🍊</td><td>x10</td></tr>
            <tr><td>🍋 🍋 🍋</td><td>x8</td></tr>
            <tr><td>🍒 🍒 🍒</td><td>x5</td></tr>
            <tr><td>будь-які 2 однакових</td><td>x1 (повернення ставки)</td></tr>
        </table>
    </details>
</div>

<script src="/static/js/slots.js?v={{ asset_version('js/slots.js') }}" defer></script>
{% endblock %}
