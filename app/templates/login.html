{% extends "base.html" %}
{% block title %}Log In — AURUM{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Log In</h1>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form action="/auth/login" method="post" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ next or '' }}">

        <label for="identifier">Username or Email</label>
        <input type="text" id="identifier" name="identifier" required autocomplete="username">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">

        <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="/register{{ '?next=' + next|urlencode if next else '' }}">Sign Up</a></p>
</div>
{% endblock %}
